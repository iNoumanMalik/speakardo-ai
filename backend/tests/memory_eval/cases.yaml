- id: update-10
  group: update
  setup_memories: [{content: "Your office is in Gulberg", key: work_location, category: work}]
  messages: ["Our office moved to DHA"]
  expect_saves: [{contains: ["dha"], key: work_location}]
  expect_updated_from: "gulberg"

