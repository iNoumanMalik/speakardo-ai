# --- update: a new value replaces the old one -----------------------------------------------
- id: update-01
  group: update
  setup_memories: [{content: "Your home city is Islamabad", key: home_city, category: places}]
  messages: ["I moved to Lahore"]
  expect_saves: [{contains: ["lahore"], key: home_city}]
  expect_updated_from: "islamabad"

- id: update-02
  group: update
  setup_memories: [{content: "Your office is in Blue Area", key: work_location, category: work}]
  messages: ["Remember that my office is now in F-7"]
  expect_saves: [{contains: ["f-7"], key: work_location}]
  expect_updated_from: "blue area"

- id: update-03
  group: update
  setup_memories: [{content: "You work at Systems Limited", key: employer, category: work}]
  messages: ["I now work at Arbisoft"]
  expect_saves: [{contains: ["arbisoft"], key: employer}]
  expect_updated_from: "systems limited"

- id: update-04
  group: update
  setup_memories: [{content: "You wake up at 7 AM", key: wake_time, kind: preference, category: routine}]
  messages: ["These days I wake up at 6 AM"]
  expect_saves: [{contains: ["6"], key: wake_time}]
  expect_updated_from: "7 am"

- id: update-05
  group: update
  setup_memories: [{content: "You are a junior developer", key: job_title, category: work}]
  messages: ["I got promoted to team lead"]
  expect_saves: [{contains: ["team lead"], key: job_title}]
  expect_updated_from: "junior developer"

- id: update-06
  group: update
  setup_memories: [{content: "Your favourite food is biryani", key: favorite_food, kind: preference, category: personal}]
  messages: ["Actually my favourite food is nihari now"]
  expect_saves: [{contains: ["nihari"], key: favorite_food}]
