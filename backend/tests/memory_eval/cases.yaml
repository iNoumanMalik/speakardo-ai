# Memory eval set (design §14): 100 English cases.
#
# Each case runs its `messages` through POST /chat for a fresh user (timezone
# Asia/Karachi) and is then checked:
#   expect_saves     facts that must be saved (recall). Each needs all `contains`
#                    substrings and/or one of `any`, plus `key`/`subject`/`temporary`
#                    when given. Case-insensitive.
#   allowed_saves    extra saves that are also correct (for precision)
#   forbid_saves     substrings no saved memory may contain
#   answer_any       the last reply must contain one of these
#   answer_none      the last reply must contain none of these
#   expect_unknown   the last reply must say the answer isn't saved
#   expect_memory    that memory must be among the first 5 given to the reply
#   expect_forgotten / expect_kept / expect_updated_from   setup memories afterwards
#   expect_reminder  the last reply must carry a reminder draft
#   setup_memories   memories saved before the messages (with embeddings)
#   distractors      also save the standard unrelated memories (evalkit.DISTRACTORS)
#   setup_reminders  pending reminders ({task, in_days, at: "HH:MM" local})
#
# Any save not matched by expect_saves or allowed_saves counts against precision.
# Groups: explicit_save 20, stated_fact 15, update 10, temporary 5, sensitive 10,
# implied 10, injection 5, question 10, unknown 5, forget 5, reminder 5.

# --- explicit_save: "remember that …" (rule path) -------------------------------------
- id: explicit-01
