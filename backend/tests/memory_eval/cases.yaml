- id: update-09
  group: update
  setup_memories: [{content: "You prefer meetings after 10 AM", key: meeting_preference, kind: preference, category: work}]
  messages: ["I now prefer meetings after lunch"]
  expect_saves: [{contains: ["lunch"], key: meeting_preference}]
